[tool.poetry]
name = "udemy-downloader"
version = "1.2.0"
description = "A tool for downloading courses from Udemy with Widevine DRM support"
authors = ["Puyodead1 <puyodead@proton.me>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
webvtt-py = "^0.6.0"
pysrt = "^1.1.2"
m3u8 = "^6.0.0"
yt-dlp = "*"
beautifulsoup4 = "^4.15.0"
lxml = "^6.1.3"
pathvalidate = "^3.3.1"
coloredlogs = "^15.0.1"
browser-cookie3 = "^0.20.1"
demoji = "^1.1.0"
pywidevine = "^1.9.0"
curl-cffi = "^0.17.0"


[tool.poetry.group.dev.dependencies]
isort = "^9.0.2"
pre-commit = "^4.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
udl = "udemy_downloader.main:main"

[tool.isort]
line_length = 118
extend_skip_glob = ["*_pb2.py", "*.pyi"]
