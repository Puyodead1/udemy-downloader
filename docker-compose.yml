services:
  udemy-downloader:
    container_name: udemy-downloader
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./output:/app/out_dir:rw
      # writable so keys fetched with --device are saved
      - ./keyfile.json:/app/keyfile.json:rw
      - ./devices:/app/devices:ro
    # COURSE_URL and UDEMY_BEARER are filled in by docker compose from the .env file
    command: $COURSE_URL -b $UDEMY_BEARER -o /app/out_dir
