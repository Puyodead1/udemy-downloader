services:
  udemy-downloader:
    container_name: udemy-downloader
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./output:/app/out_dir:rw
      # writable so keys fetched with --device are saved
      - ./keyfile.json:/app/keyfile.json:rw
      - ./devices:/app/devices:ro
    env_file:
      - .env
    command: $COURSE_URL -o /app/out_dir
